services:
  database:
    image: mariadb:12.3-noble
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-root_password}
      - MARIADB_USER=${MARIADB_USER:-app}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:-app_password}
      - MARIADB_DATABASE=${MARIADB_DATABASE:-app}
    volumes:
      - database_data:/var/lib/mysql
    ports:
      - 3306:3306
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - 8080:80
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=database
      - PMA_USER=${MARIADB_USER:-app}
      - PMA_PASSWORD=${MARIADB_PASSWORD:-app_password}
    depends_on:
      - database
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: ${APP_BUILD_TARGET:-dev}
    ports:
      - 8000:3000
    volumes:
      - .:/app/
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - database
      - renderer
    restart: unless-stopped

  # Shiki and Mermaid rendering for chapters (Node + Chromium); only reachable from the app.
  renderer:
    build:
      context: ./docker/renderer
    restart: unless-stopped

volumes:
  database_data:
  caddy_data:
  caddy_config:
