name: PR title

# Release Please reads Conventional Commits, and a squash merge uses the PR title as the commit message.
on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions: {}

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
