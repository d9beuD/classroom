name: Deploy

# Run from the Actions tab, or via the API:
# POST /repos/{owner}/{repo}/actions/workflows/deploy.yml/dispatches {"ref":"main","inputs":{"deploy-renderer":true}}
on:
  workflow_dispatch:
    inputs:
      deploy-renderer:
        description: Also deploy the renderer
        type: boolean
        default: false

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Log in to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Name the app image
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT" # ghcr.io rejects uppercase names
      # use: false keeps plain `docker build` on the default builder for the renderer step below.
      - uses: docker/setup-buildx-action@v4
        id: buildx
        with:
          use: false
      - name: Build and push the app image
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          target: prod
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          # Layers are kept in the GitHub Actions cache, so an unchanged composer.lock reuses the vendor/ layer.
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push the renderer image, if docker/renderer changed
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-renderer"
          # Git tree hash of the build context: it changes only when a file in docker/renderer does.
          TAG="$(git rev-parse HEAD:docker/renderer)"
          if docker manifest inspect "$IMAGE:$TAG" > /dev/null 2>&1; then
            echo "docker/renderer unchanged, $IMAGE:$TAG already exists: skipping."
            exit 0
          fi
          docker build --tag "$IMAGE:$TAG" --tag "$IMAGE:latest" docker/renderer
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

  # Separate jobs so the app and the renderer deploy in parallel.
  deploy-renderer:
    if: inputs.deploy-renderer
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write # for Tailscale workload identity federation
    steps:
      - uses: d9beuD/deploy-coolify-tailscale@v1
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-audience: ${{ secrets.TS_AUDIENCE }}
          tailscale-tags: tag:d9beud-deploy
          webhook: ${{ secrets.COOLIFY_RENDERER_DEPLOY_WEBHOOK }}
          coolify-token: ${{ secrets.COOLIFY_TOKEN }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write # for Tailscale workload identity federation
    steps:
      - uses: d9beuD/deploy-coolify-tailscale@v1
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-audience: ${{ secrets.TS_AUDIENCE }}
          tailscale-tags: tag:d9beud-deploy
          webhook: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          coolify-token: ${{ secrets.COOLIFY_TOKEN }}
