name: Deploy

# Run from the Actions tab, or via the API:
# POST /repos/{owner}/{repo}/actions/workflows/deploy.yml/dispatches {"ref":"main"}
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and push the image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}" # ghcr.io rejects uppercase names
          docker build --target prod --tag "$IMAGE:$GITHUB_SHA" --tag "$IMAGE:latest" .
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write # for Tailscale workload identity federation
    steps:
      - uses: d9beuD/deploy-coolify-tailscale@v1
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-audience: ${{ secrets.TS_AUDIENCE }}
          coolify-url: ${{ vars.COOLIFY_URL }}
          coolify-token: ${{ secrets.COOLIFY_TOKEN }}
          uuid: ${{ vars.COOLIFY_APP_UUID }}
