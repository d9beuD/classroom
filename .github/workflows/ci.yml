name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_mysql, zip
          coverage: none
      # Its cache:clear script builds var/cache/dev, whose container XML PHPStan and Rector read.
      - uses: ramsey/composer-install@v4
      - name: php-cs-fixer, Rector and PHPStan
        run: composer lint
